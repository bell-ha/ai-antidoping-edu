# 화면에 보이는 교육 콘텐츠 카탈로그. profiles.py가 content_id를 이걸로 풀어 API 응답을 만든다.
# content_id = knowledge/ 문서 ID. contents의 순서가 지도자 팀 요약의 고정 표시 순서다(빈도순 아님, D9).
# 태그와 표시 문구의 대응(tags)도 여기 둔다. 판정 임계값은 rules.yaml에 있다.

version: 2026

tags:
  rapid_improvement: 최근 경기력 급격한 향상
  decline: 최근 경기력 감소
  weight_change: 체급 또는 체중 변화
  high_level: 높은 경기 수준
  baseline: 특이 변화 없음

contents:
  anti-doping-basics:
    title: 반도핑 기본 교육
    summary: 엄격책임 원칙, 선수의 권리와 책임, 도움을 구할 곳.
    suggested_question: 도핑 규정에서 선수가 꼭 알아야 할 게 뭐야?
  prohibited-list-overview:
    title: 경기력 향상제 관련 규정
    summary: 금지목록의 구조(상시 금지, 경기기간 중 금지)와 위반 시 제재.
    suggested_question: 금지목록에서 상시 금지와 경기기간 중 금지는 어떻게 달라?
  supplement-contamination:
    title: 보충제 오염 위험
    summary: 성분표에 없는 금지물질이 섞일 수 있는 이유와 선택 시 확인할 점.
    suggested_question: 프로틴 보충제 먹어도 돼?
  recovery-health:
    title: 회복과 건강관리
    summary: 부상·컨디션 저하 시기에 약물에 의존하지 않는 회복 관리.
    suggested_question: 부상에서 회복할 때 주의할 약이 있어?
  medication-check-procedure:
    title: 약물 사용 시 확인 절차
    summary: 병원·약국에서 선수임을 알리고 복용 전 확인하는 순서, 치료목적사용면책(TUE).
    suggested_question: 병원에서 약 처방받을 때 뭘 확인해야 해?
  weight-control-substances:
    title: 체중조절 과정의 금지약물
    summary: 감량·증량 과정에서 문제가 되는 약물과 건강 위험.
    suggested_question: 계체 전에 살 빼는 약 먹어도 돼?
  diuretics-masking:
    title: 이뇨제와 은폐제
    summary: 이뇨제가 상시 금지인 이유와 일상 의약품 속 이뇨 성분.
    suggested_question: 이뇨제는 왜 금지야?
  testing-procedure:
    title: 도핑검사 절차
    summary: 검사 통보부터 시료 채취까지 선수의 권리와 의무.
    suggested_question: 도핑검사 받을 때 순서가 어떻게 돼?
  whereabouts:
    title: 소재지정보
    summary: 소재지정보 제출 대상, 제출 방법, 불이행의 결과.
    suggested_question: 소재지정보는 언제까지 뭘 입력해야 해?
  international-competition-prep:
    title: 국제대회 준비
    summary: 해외에서 의약품을 살 때 확인 방법, 출국 전 점검할 것.
    suggested_question: 해외 대회 가서 감기약 사야 하면 어떻게 해?
