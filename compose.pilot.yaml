# 시범 적용 override. 학교 서버에서:
#   docker compose -f compose.yaml -f compose.pilot.yaml up -d --build
# 필수 값(비밀키·API 키·PILOT_DATA)이 빠지면 compose가 실패한다(데모 설정으로 뜨는 사고 방지).
#
# 이미지 밖(서버 경로 PILOT_DATA)에서 넣는 것:
#   models/    — 연구진 모델(model_params.json: source real, rnn_M.npz/json). 아직 없으면 빈 폴더만 만들어 두면 합성 모델로 뜬다
#   db/        — 운영 DB 폴더(쓰기). 선수 계정은 관리자 화면에서 등록한다(가입 없음)
# 사람 검토 전 항목·합성 모델·금지목록 유효기간은 서버를 막지 않고 시작 로그에 알림만 남긴다.
# 리버스 프록시(nginx 등)가 HTTPS를 처리한다(같은 서버면 FORWARDED_ALLOW_IPS 기본값 127.0.0.1). 워커는 1개.
services:
  app:
    environment:
      DEMO_MODE: "0"
      LLM_MODE: live
      COOKIE_SECURE: "1"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET을 설정하세요 (32자 이상 무작위)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY를 설정하세요}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}  # 조직 키일 때만
      APP_DB: /app/var/db/app.sqlite  # 운영 DB — 아래 db 폴더에 남는다
      DAILY_CHAT_LIMIT: ${DAILY_CHAT_LIMIT:-30}
      SURVEY_URL: ${SURVEY_URL:-}  # 예: https://forms…/?pid={pid}
    ports: !override
      - "127.0.0.1:${PORT:-8100}:8000"  # 프록시만 접근
    volumes: !override
      # llm_cache 볼륨은 쓰지 않는다(시범은 live). 리눅스에서 호스트 디렉터리 소유자가 uid 10001이 아니면 쓰기 실패.
      # create_host_path: false — 파일이 없으면 빈 폴더를 만들지 않고 바로 실패한다.
      - type: bind
        source: ${PILOT_DATA:?시범 데이터 폴더 PILOT_DATA를 설정하세요}/models
        target: /app/private/models
        read_only: true
        bind: { create_host_path: false }
      # 운영 DB 폴더(쓰기). 미리 만들고 소유자를 uid 10001로: mkdir -p $PILOT_DATA/db && chown 10001 $PILOT_DATA/db
      - type: bind
        source: ${PILOT_DATA}/db
        target: /app/var/db  # /app/var 전체를 덮으면 이미지 안의 약물 DB(var/drugs.sqlite)가 가려진다
        bind: { create_host_path: false }
