# 시범 적용(§10) override. 학교 서버에서:
#   docker compose -f compose.yaml -f compose.pilot.yaml up -d --build
# 필수 값이 빠지면 compose가 실패한다(데모 설정으로 뜨는 사고 방지).
#
# 선수 프로파일은 선수가 입력한 기록으로 계산하고 저장하지 않는다(D25) → 프로파일 파일은 마운트하지 않는다.
# 연구진이 발급한 접근 코드만 이미지 밖(서버 경로)에서 읽기 전용으로: /srv/adedu/data/access_codes.json
# 지도자 팀 요약은 시범에서 비활성(D25). 모델 파라미터가 합성이면 서버가 시작을 거부한다(D26).
# 시작 관문: reviewed:false 항목이 하나라도 있으면 서버가 시작을 거부한다(G2).
# 리버스 프록시(nginx 등)가 HTTPS를 처리하고, FORWARDED_ALLOW_IPS에 프록시 IP를 넣는다. 워커는 1개.
services:
  app:
    environment:
      DEMO_MODE: "0"
      LLM_MODE: live
      COOKIE_SECURE: "1"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET을 설정하세요 (32자 이상 무작위)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY를 설정하세요}
      CLAUDE_MODEL: ${CLAUDE_MODEL:?CLAUDE_MODEL을 명시하세요}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?리버스 프록시 IP를 설정하세요}
    ports: !override
      - "127.0.0.1:${PORT:-8100}:8000"  # 프록시만 접근
    volumes: !override
      # llm_cache 볼륨은 쓰지 않는다(시범은 live). 리눅스에서 호스트 디렉터리 소유자가 uid 10001이 아니면 쓰기 실패.
      # create_host_path: false — 파일이 없으면 빈 폴더를 만들지 않고 바로 실패한다.
      - type: bind
        source: ${PILOT_DATA:?접근 코드 폴더 PILOT_DATA를 설정하세요}/access_codes.json
        target: /app/data/access_codes.json
        read_only: true
        bind: { create_host_path: false }
