[project]
name = "antidoping-edu-analysis"
version = "0.1.0"
description = "오프라인 경기력 분석: 합성 데이터 → 예측 → 교육 프로파일 → data/*.json (D2)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",  # backend/app/profiling·schemas를 import한다(추론·규칙 코드 공유, D25)
]
[project.optional-dependencies]
# wada_extract.py 전용(오프라인 도구, 서버·이미지에는 들어가지 않음). PyMuPDF는 AGPL이라 배포하지 않는 이 사용 방식만
wada = ["pymupdf>=1.24"]
# 실행은 backend 가상환경으로 해도 된다: cd analysis && ../backend/.venv/bin/python export.py
# D4: LSTM으로 교체할 때 torch 추가. D6: xgboost·shap은 P1 착수 때 결정.
