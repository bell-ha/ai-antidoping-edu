# WADA 2026 금지목록 — 자동 추출(analysis/wada_extract.py)을 보완하는 손 보정.
# 자동 추출이 문장형 섹션을 다루지 못하는 곳(S0, M1–M3), 종목 목록(P1), 섹션 NOTE, 흔한 별칭만 여기에 둔다.
# 모든 항목은 원문 PDF의 문구에 근거한다(쪽 번호 기록). 별칭(aliases)은 원문에 없는 이름이며 "alias"로 표시된다.

manual_sections: [S0, M1, M2, M3]  # 이 섹션은 자동 추출 항목을 버리고 아래 items만 쓴다

items:
  # S0 — 원문 4쪽: "including but not limited to BPC-157, 2,4-dinitrophenol (DNP), ryanodine receptor-1-calstabin
  # complex stabilizers [e.g. S-107, S48168 (ARM210)] and troponin activators (e.g. reldesemtiv and tirasemtiv)"
  - {section: S0, name: BPC-157, page: 4}
  - {section: S0, name: "2,4-Dinitrophenol", synonyms: [DNP], page: 4}
  - {section: S0, name: Ryanodine receptor-1-calstabin complex stabilizers, page: 4}
  - {section: S0, name: S-107, page: 4}
  - {section: S0, name: S48168, synonyms: [ARM210], page: 4}
  - {section: S0, name: Troponin activators, page: 4}
  - {section: S0, name: Reldesemtiv, page: 4}
  - {section: S0, name: Tirasemtiv, page: 4}
  - {section: S0, name: Non-approved substances, synonyms: [designer drugs, substances approved only for veterinary use], page: 4,
     condition: "어느 섹션에도 없고 사람 치료용으로 승인되지 않은 약리 물질(임상 전·임상 중·중단된 약, 디자이너 약물, 동물용 전용 약)은 상시 금지"}

  # S1 — 원문 6쪽 S1.1 끝 문장 "… including their esters." (INDEX 표제어 "Esters of anabolic androgenic steroids")
  - {section: S1, subsection: S1.1, name: Esters of anabolic androgenic steroids, page: 6}

  # M1 — 원문 13쪽
  - {section: M1, subsection: M1.1, name: Blood transfusion, page: 13,
     synonyms: [blood doping, autologous blood transfusion, homologous blood transfusion, red blood cell products],
     condition: "자가·동종·이종 혈액 또는 적혈구 제제를 순환계에 투여·재주입하는 것은 상시 금지"}
  - {section: M1, subsection: M1.1, name: Withdrawal of blood, synonyms: [apheresis, Blood withdrawal], page: 13,
     condition: "혈액·혈액 성분 채취 금지. 단 1) 의료 검사·도핑검사 목적 2) 공인 기관 헌혈은 제외"}
  - {section: M1, subsection: M1.2, name: Perfluorochemicals, page: 13}
  - {section: M1, subsection: M1.2, name: Efaproxiral, synonyms: [RSR13], page: 13}
  - {section: M1, subsection: M1.2, name: Voxelotor, page: 13}
  - {section: M1, subsection: M1.2, name: Modified haemoglobin products, page: 13,
     synonyms: [haemoglobin-based blood substitutes, microencapsulated haemoglobin products],
     condition: "산소 운반 인위적 향상. 보충 산소 흡입은 제외"}
  - {section: M1, subsection: M1.3, name: Intravascular manipulation of blood, synonyms: [Blood manipulation], page: 13,
     condition: "혈액·혈액 성분을 물리적·화학적으로 혈관 안에서 조작하는 모든 방법"}
  - {section: M1, subsection: M1.4, name: Carbon monoxide re-breathing, synonyms: [Carbon monoxide, Re-breathing systems or equipment to deliver carbon monoxide], page: 13,
     condition: "일산화탄소 재호흡 장치 사용 금지. 의료·과학 전문가 감독 아래 진단 목적이면 제외"}

  # M2 — 원문 13쪽 (M2.2만 Specified Method)
  - {section: M2, subsection: M2.1, name: Sample tampering, page: 13,
     synonyms: [Tampering, sample substitution, urine substitution, sample adulteration, addition of proteases to sample, Proteases],
     condition: "도핑검사 시료의 바꿔치기·변조 시도 포함 상시 금지"}
  - {section: M2, subsection: M2.2, name: Intravenous infusion, page: 13,
     synonyms: [Infusions, Intravenous infusions/injections, intravenous injection, IV infusion, IV drip],
     condition: "12시간 동안 합계 100 mL를 넘는 정맥 수액·주사는 상시 금지. 병원 치료·수술·임상 진단 검사 중 정당하게 받은 경우는 제외. 필요하면 TUE"}

  # M3 — 원문 14쪽
  - {section: M3, subsection: M3.1, name: Gene doping, page: 14,
     synonyms: [gene editing, gene silencing, gene transfer],
     condition: "유전체 서열·유전자 발현을 바꿀 수 있는 핵산·핵산 유사체 사용 금지"}
  - {section: M3, subsection: M3.2, name: Cell doping, page: 14,
     synonyms: [genetically modified cells],
     condition: "정상 또는 유전자 변형 세포·세포 성분(핵, 미토콘드리아·리보솜 등 세포 소기관) 사용 금지"}

