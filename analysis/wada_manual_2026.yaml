# 섹션 NOTE·본문 조건(원문 요약). 앱이 결과 카드에 섹션 조건으로 보여준다.
section_conditions:
  S0: "승인되지 않은 물질: 어떤 정부 보건당국도 사람 치료용으로 승인하지 않은 약리 물질은 상시 금지."
  S3: "흡입 살부타몰·포르모테롤·살메테롤·빌란테롤은 용량 한도 안에서 예외(항목 condition 참고). 소변에서 살부타몰 1000 ng/mL, 포르모테롤 40 ng/mL를 넘으면 치료 용량이었다는 것을 선수가 입증해야 함."
  S5: "기준치 물질(포르모테롤·살부타몰·카틴·에페드린·메틸에페드린·슈도에페드린)이 이뇨제·은폐제와 함께 검출되면 양이 적어도 위반. 그 물질에 대한 TUE가 따로 있어야 함(점안 탄산탈수효소억제제·치과 펠리프레신은 제외)."
  M1: "금지방법(상시). 혈액·혈액 성분 조작."
  M2: "금지방법(상시). 화학적·물리적 조작. M2.2(정맥 수액)만 Specified Method."
  M3: "금지방법(상시). 유전자·세포 도핑."
  S9: "주사·경구(설하·볼·잇몸 등 구강점막 포함)·직장 투여는 경기기간 중 금지. 흡입·국소(치과 근관·피부·코·눈·귀·항문 주위) 투여는 허가 용량·적응증 안에서 금지 아님."
  P1: "지정 종목에서만 경기기간 중 금지, * 표시 종목은 경기기간 외에도 금지(종목 목록: sections.P1.sports). 역도는 해당 없음."

