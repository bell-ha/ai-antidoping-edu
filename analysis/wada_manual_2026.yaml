  - {section: S6, name: Methylenedioxymethamphetamine, add: [MDMA, ecstasy], source: list}
  - {section: S6, name: Metamfetamine, add: [methamphetamine], source: alias}
  - {section: S6, name: Amfetamine, add: [amphetamine], source: alias}
