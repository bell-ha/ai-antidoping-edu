- q: WADA는 뭐 하는 곳이야?  # B
  expect: [B-003]
- q: 부모님도 도핑 규정 적용돼?  # C
  expect: [C-019, C-016, E-002]
- q: 엄마가 준 진통제 먹고 걸리면 내 책임이야?  # D
  expect: [D-006]
- q: 검사 거부하면 어떻게 돼?  # E
  expect: [E-009, J-030]
- q: 도핑 걸리면 지원금도 끊겨?  # F
  expect: [F-008, F-009]
- q: 근육 키우는 약은 비시즌에 써도 안 돼?  # G
  expect: [G-003, G-012]
- q: 대마 CBD 오일은 괜찮아?  # G
  expect: [G-031, H-038]
- q: 약국에서 약 살 때 뭘 확인해야 돼?  # H
  expect: [H-003]
- q: 파스나 연고도 확인해야 돼?  # H
  expect: [H-015, M-003]
- q: 친구 보충제 빌려 먹어도 돼?  # I
  expect: [I-008, E-006]
- q: 검사할 때 신분증 없으면 어떻게 해?  # J
  expect: [J-010, J-012]
- q: 검사 세 번 놓치면 어떻게 돼?  # K
  expect: [K-012, E-012]
- q: 익명으로 도핑 제보할 수 있어?  # L
