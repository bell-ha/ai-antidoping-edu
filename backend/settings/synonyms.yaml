# 엄격책임은 정의상 "고의·과실·인지 여부와 무관"이다. ("나도 모르게"는 guard가 먼저 고정 응답으로 돌린다)
모르고: [엄격책임, 고의, 과실]
실수로: [엄격책임, 고의, 과실]
나도 모르게: [엄격책임, 고의, 과실]
몰랐: [엄격책임, 고의, 과실]
# "도핑은 왜 금지하는 거야?" — 레슨은 "금지 기준", "~ 이유"로 쓴다(A-003, A-008)
왜 금지: [이유, 기준]
# "목록에 이름 없는 약" — 레슨은 "예시에 없어도 금지일 수 있어요"(G-001)
이름 없: [예시에 없어도]

