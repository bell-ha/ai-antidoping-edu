# 구어체 질문 → 레슨 용어. 키가 질문에 들어 있으면 값을 검색어에 덧붙인다(app/chat/retrieve.py expand).
# 값은 knowledge/education/lessons/ 레슨 300개에 실제로 나오는 표기로 쓴다(예: 검사관 → 도핑검사관).
# 늘리는 원칙: backend/tests/retrieval_eval.yaml(튜닝셋)에서 실패를 먼저 확인하고, 그 실패를 고치면서 다른 문항을
#   떨어뜨리지 않는 항목만 더한다. 추측으로 늘리면 엉뚱한 레슨이 올라온다(예: KADA → 한국도핑방지위원회를 넣으면
#   KADA가 들어간 모든 질문이 B-007로 쏠려서 넣지 않았다). 키가 이미 레슨에 흔히 나오는 말이면 넓히지 않는다.
# 다 고친 뒤 backend/tests/retrieval_heldout.yaml로 한 번만 확인한다. hold-out 실패를 보고 이 파일을 고치지 않는다.
# 기록(2026-10-23, 레슨 300개 기준으로 다시 씀): 튜닝셋 60문항 recall@3 0.850 → 0.950, recall@6 0.900 → 1.000.
#   hold-out 15문항 recall@6 0.867(고치기 전과 같음. 실패 2: "부모님도 도핑 규정 적용돼?", "검사 세 번 놓치면 어떻게 돼?").

# 보충제
프로틴: [보충제, 단백질]
단백질: [보충제]
부스터: [보충제]
영양제: [보충제]
비타민: [보충제]

